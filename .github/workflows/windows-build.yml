name: Legacy desktop build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m playwright install chromium
      - run: pyinstaller --noconfirm --clean --windowed --name Shotdown --paths src --collect-all playwright src/longchatpdf/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shotdown-Legacy-Desktop-Windows
          path: dist/Shotdown/
