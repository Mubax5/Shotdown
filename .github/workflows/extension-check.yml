name: Extension check

on:
  push:
    paths:
      - "extension/**"
      - "run_extension.bat"
      - "package_extension.bat"
      - ".github/workflows/extension-check.yml"
  pull_request:
    paths:
      - "extension/**"
      - "run_extension.bat"
      - "package_extension.bat"

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check extension/content.js
      - run: node --check extension/service-worker.js
